# The turtle simulator for the workshop, with the Fleetless bridge built in.
# Replace frt_... below with your robot token, then run this in this folder:
#
#   docker compose up -d
#
# The view is at http://localhost:8765, and `docker compose logs -f turtle`
# shows what the turtle is doing. `docker compose down -v` removes the
# container and its volume.
#
# Keep the token in this file on your machine. Don't paste it into a chat,
# commit it or show it in a screenshot. All other settings of the image are
# described in https://github.com/fleetless/turtle-sim#readme
services:
  turtle:
    image: ghcr.io/fleetless/turtle-sim:latest
    container_name: turtle
    environment:
      # The token the console showed when you created the robot.
      FLEETLESS_TOKEN: frt_...
    ports:
      # The view, reachable from this machine only.
      - "8765:8765"
    volumes:
      # Lets the bridge remember running jobs across restarts.
      - turtle-state:/state

volumes:
  turtle-state:
